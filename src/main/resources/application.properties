spring.application.name=hyuabot-backend-kotlin
# DataSource (HikariCP) - sized above the default 10 to absorb GraphQL fan-out; keep <= Postgres max_connections
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=20000
spring.datasource.hikari.max-lifetime=1800000
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Batch lazy-collection loads (turns N+1 into a few IN queries) and batch writes
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false
# Log
logging.level.app.hyuabot.backend=DEBUG
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF
# Exception
spring.web.error.include-stacktrace=never
# Graceful shutdown — finish in-flight requests before pod is removed
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
# Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Swagger
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.path=/swagger-ui/index.html
# APNs Live Activity
apns.live-activity.enabled=${APNS_LIVE_ACTIVITY_ENABLED:false}
apns.live-activity.team-id=${APNS_TEAM_ID:}
apns.live-activity.key-id=${APNS_KEY_ID:}
apns.live-activity.bundle-id=${APNS_BUNDLE_ID:net.jaram.hyuabot}
apns.live-activity.private-key=${APNS_PRIVATE_KEY:}
apns.live-activity.base-url=${APNS_BASE_URL:}
# Admin overview
admin.overview.prometheus-base-url=${PROMETHEUS_BASE_URL:http://prometheus:9090}
admin.overview.grafana-url=${GRAFANA_PUBLIC_URL:https://grafana.hyuabot.app}
admin.timetable-import.preview-ttl-minutes=${TIMETABLE_IMPORT_PREVIEW_TTL_MINUTES:15}
# Admin Web Push
admin.push.notifier-base-url=${NOTIFIER_BASE_URL:http://127.0.0.1:8081}
admin.push.notifier-service-token=${NOTIFIER_SERVICE_TOKEN:}
