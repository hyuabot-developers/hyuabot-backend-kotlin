query ShuttleRealtimePageQuery(
    $language: String!
    $subwayLanguage: String!
    $after: LocalTime
    $shuttleStops: [ShuttleStopInput!]!
    $subwayKeys: [SubwayStationInput!]!
    $subwayTimetableKeys: [SubwayStationInput!]!
    $transferBusInput: [BusRouteStopInput!]!
    $alternativeInput: [BusRouteStopInput!]!
) {
    notices(input: {language: $language, category: "셔틀,날씨"}) {
        notices {
            title
            url
            expiredAt
        }
    },
    shuttle(input: {
        stops: $shuttleStops,
        after: $after
    }) {
        stops {
            latitude
            longitude
            name
            timetable {
                order {
                    seq
                    route {
                        tag
                        name
                    }
                    time
                    stops {
                        stop
                        time
                    }
                }
                destination {
                    destination
                    entries {
                        seq
                        route {
                            tag
                            name
                        }
                        time
                        stops {
                            stop
                            time
                        }
                    }
                }
            }
        }
    }
    subway(input: { language: $subwayLanguage, keys: $subwayKeys }) {
        stationID
        arrival {
            direction
            entries {
                minutes
                isRealtime
                location
                stops
                terminal { stationID name }
            }
        }

    }
    subwayTimetable: subway(input: {language: $subwayLanguage, keys: $subwayTimetableKeys}) {
        stationID
        timetable {
            weekday
            direction
            time
            terminal { stationID name }
        }
    }
    transferBus: bus(input: $transferBusInput) {
        stop { seq }
        arrival { minutes stops isRealtime }
        log { time }
    }
    busAlternative: bus(input: $alternativeInput) {
        route { seq }
        stop { seq name latitude longitude }
        arrival { stops seats minutes lowFloor isRealtime time }
    }
}
