name: Deploy Docker Image
on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      no-cache:
        description: Build Docker image without using cache
        required: false
        default: false
        type: boolean
jobs:
  select-build-runner:
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ["self-hosted", "ARM64", "1st"]
    outputs:
      use_mac: ${{ steps.runner.outputs.use_mac }}
    steps:
      - name: Check Mac runner availability
        id: runner
        env:
          RUNNER_ADMIN_TOKEN: ${{ secrets.RUNNER_ADMIN_TOKEN || github.token }}
          ORG: ${{ github.repository_owner }}
          TARGET_RUNNER_NAME: Jeongin-MBP
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("RUNNER_ADMIN_TOKEN", "")
          org = os.environ["ORG"]
          runner_name = os.environ["TARGET_RUNNER_NAME"]
          use_mac = "false"

          if token:
              try:
                  request = urllib.request.Request(
                      f"https://api.github.com/orgs/{org}/actions/runners?per_page=100",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=10) as response:
                      runners = json.load(response).get("runners", [])
                  for runner in runners:
                      if runner.get("name") == runner_name:
                          if runner.get("status") == "online" and not runner.get("busy"):
                              use_mac = "true"
                          break
              except Exception as error:
                  print(f"Could not check {runner_name}; using Oracle fallback: {error}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"use_mac={use_mac}\n")
          PY

  build-jar-mac:
    needs: select-build-runner
    if: needs.select-build-runner.outputs.use_mac == 'true'
    runs-on: ["self-hosted", "ARM64", "macOS"]
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      JASYPT_PASSWORD: ${{ secrets.JASYPT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          check-latest: 'true'
          cache: 'gradle'
      - name: Create encrypted application.properties
        run: |
          echo "spring.datasource.driver-class-name=org.postgresql.Driver" > src/main/resources/encrypted.properties
          echo "spring.datasource.url=$DATABASE_URL" >> src/main/resources/encrypted.properties
          echo "spring.datasource.username=$DATABASE_USERNAME" >> src/main/resources/encrypted.properties
          echo "spring.datasource.password=$DATABASE_PASSWORD" >> src/main/resources/encrypted.properties
          echo "spring.data.redis.host=$REDIS_URL" >> src/main/resources/encrypted.properties
          echo "spring.data.redis.port=$REDIS_PORT" >> src/main/resources/encrypted.properties
          echo "spring.sql.init.mode=always" >> src/main/resources/encrypted.properties
          echo "jasypt.encryptor.password=$JASYPT_PASSWORD" >> src/main/resources/encrypted.properties
          echo "jwt.secret=$JWT_SECRET" >> src/main/resources/encrypted.properties
          echo "jwt.expiration=5" >> src/main/resources/encrypted.properties
          echo "jwt.expiration.refresh=7" >> src/main/resources/encrypted.properties
      - name: Build application jar
        run: |
          ./gradlew --no-daemon bootJar -x test
          cp "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)" build/libs/app.jar
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  build-jar-oracle:
    needs: select-build-runner
    if: needs.select-build-runner.outputs.use_mac != 'true'
    runs-on: ["self-hosted", "ARM64", "1st"]
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      JASYPT_PASSWORD: ${{ secrets.JASYPT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          check-latest: 'true'
          cache: 'gradle'
      - name: Create encrypted application.properties
        run: |
          echo "spring.datasource.driver-class-name=org.postgresql.Driver" > src/main/resources/encrypted.properties
          echo "spring.datasource.url=$DATABASE_URL" >> src/main/resources/encrypted.properties
          echo "spring.datasource.username=$DATABASE_USERNAME" >> src/main/resources/encrypted.properties
          echo "spring.datasource.password=$DATABASE_PASSWORD" >> src/main/resources/encrypted.properties
          echo "spring.data.redis.host=$REDIS_URL" >> src/main/resources/encrypted.properties
          echo "spring.data.redis.port=$REDIS_PORT" >> src/main/resources/encrypted.properties
          echo "spring.sql.init.mode=always" >> src/main/resources/encrypted.properties
          echo "jasypt.encryptor.password=$JASYPT_PASSWORD" >> src/main/resources/encrypted.properties
          echo "jwt.secret=$JWT_SECRET" >> src/main/resources/encrypted.properties
          echo "jwt.expiration=5" >> src/main/resources/encrypted.properties
          echo "jwt.expiration.refresh=7" >> src/main/resources/encrypted.properties
      - name: Build application jar
        run: |
          ./gradlew --no-daemon bootJar -x test
          cp "$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)" build/libs/app.jar
      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  deploy:
    needs:
      - build-jar-mac
      - build-jar-oracle
    if: always() && (needs.build-jar-mac.result == 'success' || needs.build-jar-oracle.result == 'success')
    runs-on: ["self-hosted", "ARM64", "1st"]
    environment: production
    env:
      IMAGE_NAME: localhost:5000/hyuabot-backend-kotlin:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Download application jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          keep-state: true
          cleanup: false
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs['no-cache'] }}
      - name: Push docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}
      - name: Clean local docker image
        if: always()
        run: |
          docker image rm ${{ env.IMAGE_NAME }} || true
          docker image prune -f
  restart:
    if: always() && github.event_name == 'workflow_dispatch' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ["self-hosted", "ARM64", "1st"]
    environment: production
    steps:
      - name: Restart backend service
        run: |
          kubectl -n hyuabot rollout restart deployment/hyuabot-backend-kotlin
